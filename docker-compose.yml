# Agent Worker: a headless coding agent (Cursor, Claude Code or OpenAI Codex) for anything that
# speaks MCP or the OpenAI API.
#
#   cp .env.example .env      # paste CURSOR_API_KEY and/or OPENAI_API_KEY, generate WORKER_TOKEN
#   docker compose up -d
#   # Codex with your ChatGPT plan instead of an API key (link + one-time code; kept in the volume):
#   docker exec -it agent-worker python -m agent_worker.codex_login
#
# MCP:      http://<host>:8787/mcp            (Hermes, Claude Code, Open WebUI tools, AI Workspace)
# OpenAI:   http://<host>:8787/v1             (Open WebUI connection, any OpenAI client)
# Jobs:     http://<host>:8787/jobs           (start, poll, stream, cancel)
# Every endpoint except /health needs:  Authorization: Bearer $WORKER_TOKEN

name: agent-worker

services:
  agent-worker:
    # Pinned release; CI publishes it on the v0.5.0 tag. `build: .` builds the same tag from this
    # checkout only when you ask for it (`docker compose build`); deploy with `up -d --no-build`.
    image: ghcr.io/domdus/agent-worker:0.5.0
    build: .
    container_name: agent-worker
    env_file: .env
    ports:
      # Only this machine. Use "8787:8787" to open it to your LAN (WORKER_TOKEN is then required).
      - "127.0.0.1:8787:8787"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - agent-worker-data:/data
      # A host project as the default workspace (owned by uid 1000, or set user: below):
      # - /path/to/project:/workspace
      # MCP servers every job gets (stdio allowed here, not from requests):
      # - ./mcp.json:/data/mcp.json:ro
      # Codex: an auth.json from `codex login` on another computer, copied into /data/codex once
      # (set CODEX_AUTH_JSON=/run/secrets/codex_auth.json in .env):
      # - ~/.codex/auth.json:/run/secrets/codex_auth.json:ro
      # Git key for GIT_REPO over SSH:
      # - ~/.ssh/id_ed25519:/run/secrets/git_ssh:ro
      # SSH to servers (SSH_KEY / SSH_CONFIG / SSH_KNOWN_HOSTS in .env point here):
      # - ./ssh/worker_key:/run/secrets/worker_ssh_key:ro
      # - ./ssh/config:/run/secrets/ssh_config:ro
      # - ./ssh/known_hosts:/run/secrets/known_hosts:ro
    # Only with CODEX_SANDBOX=codex: let Codex's own sandbox (bubblewrap) create user namespaces.
    # security_opt:
    #   - seccomp=unconfined
    #   - apparmor=unconfined
    restart: unless-stopped

  # Optional: Open WebUI already wired to the worker. `docker compose --profile webui up -d`
  open-webui:
    profiles: ["webui"]
    image: ghcr.io/open-webui/open-webui:main
    container_name: open-webui
    ports:
      - "127.0.0.1:3000:8080"
    environment:
      OPENAI_API_BASE_URL: http://agent-worker:8787/v1
      OPENAI_API_KEY: ${WORKER_TOKEN}
      # Sends X-OpenWebUI-Chat-Id so one chat keeps one Cursor agent.
      ENABLE_FORWARD_USER_INFO_HEADERS: "true"
    volumes:
      - open-webui-data:/app/backend/data
    depends_on:
      - agent-worker
    restart: unless-stopped

volumes:
  agent-worker-data:
  open-webui-data:
